services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jabarin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jabarin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jabarin?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-jabarin-dev-secret-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SEED_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
